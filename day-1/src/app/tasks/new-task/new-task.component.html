<div class="backdrop" (click)="onCancel()"></div>

<dialog open class="modal-dialog">
  <div class="modal-header">
    <div class="modal-title-group">
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
      </div>
      <div>
        <h2>Add New Task</h2>
        <p class="modal-subtitle">Assigning task to <strong>{{ userName }}</strong> ({{ userId }})</p>
      </div>
    </div>
    <button type="button" class="close-btn" (click)="onCancel()" aria-label="Close dialog">×</button>
  </div>

  <form (ngSubmit)="onSubmit()" class="task-form">
    <div class="form-row">
      <div class="form-group">
        <label for="taskId">Task ID</label>
        <input
          type="text"
          id="taskId"
          name="taskId"
          [(ngModel)]="customTaskId"
          placeholder="e.g. task-101"
          required
        />
        <small class="help-text">Auto-generated or custom identifier</small>
      </div>

      <div class="form-group">
        <label for="userId">User ID</label>
        <input
          type="text"
          id="userId"
          name="userId"
          [value]="userId"
          readonly
          class="readonly-input"
        />
        <small class="help-text">Assigned team member ID</small>
      </div>
    </div>

    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input
        type="text"
        id="title"
        name="title"
        [(ngModel)]="enteredTitle"
        placeholder="Enter task headline / title"
        required
      />
    </div>

    <div class="form-group">
      <label for="summary">Summary <span class="required">*</span></label>
      <textarea
        id="summary"
        name="summary"
        rows="4"
        [(ngModel)]="enteredSummary"
        placeholder="Describe the task details, deliverables, and context..."
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label for="dueDate">Due Date <span class="required">*</span></label>
      <input
        type="date"
        id="dueDate"
        name="dueDate"
        [(ngModel)]="enteredDueDate"
        required
      />
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button type="submit" class="btn-submit">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        Create Task
      </button>
    </div>
  </form>
</dialog>
