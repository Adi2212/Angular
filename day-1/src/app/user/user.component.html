<div class="user-container">
  <div class="sidebar-header">
    <div class="sidebar-title-row">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <h3>Team Members</h3>
    </div>
    <span class="user-count">{{ users.length }}</span>
  </div>

  <p class="sidebar-instruction">Select a member to view or assign tasks:</p>

  <ul class="users-list">
    @for (user of users; track user.id) {
      <li>
        <button
          type="button"
          class="user-btn"
          [class.active]="user.id === selectedUserId"
          (click)="onSelect(user)">
          <div class="avatar-box">
            <img [src]="user.avatar" [alt]="user.name" />
            @if (user.id === selectedUserId) {
              <span class="active-badge">✓</span>
            }
          </div>
          <div class="user-meta">
            <span class="user-name">{{ user.name }}</span>
            <span class="user-badge">ID: {{ user.id }}</span>
          </div>
          <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </li>
    }
  </ul>
</div>
