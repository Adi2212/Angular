<header class="app-header">
  <div class="header-brand">
    <div class="logo-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path>
        <path d="M7 7h.01"></path>
      </svg>
    </div>
    <div class="brand-text">
      <h1>EasyTask</h1>
      <p class="subtitle">Enterprise Task Management & Team Dashboard</p>
    </div>
  </div>

  <div class="header-actions">
    <!-- Dark / Light Theme Toggle -->
    <button
      type="button"
      class="theme-toggle-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <div class="toggle-track" [class.dark]="isDarkMode">
        <span class="icon-sun" [class.active]="!isDarkMode" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </span>
        <span class="icon-moon" [class.active]="isDarkMode" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </span>
        <span class="toggle-thumb" [class.dark]="isDarkMode"></span>
      </div>
      <span class="theme-label">{{ isDarkMode ? 'Dark' : 'Light' }}</span>
    </button>

    <div class="header-badge">
      <span class="badge-dot"></span>
      <span>Day 2 Angular</span>
    </div>
  </div>
</header>
