<app-card>
  <div class="task-header">
    <div class="task-title-group">
      <span class="task-id-badge">#{{ task.id }}</span>
      <h3>{{ task.title }}</h3>
    </div>
    <span class="task-user-tag">User: {{ task.userId }}</span>
  </div>

  <p class="task-summary">{{ task.summary }}</p>

  <div class="task-footer">
    <div class="due-date">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect>
        <line x1="16" y1="2" y2="6"></line>
        <line x1="8" y1="2" y2="6"></line>
        <line x1="3" x2="21" y1="10" y2="10"></line>
      </svg>
      <span>Due: <strong>{{ task.dueDate | date: 'fullDate' }}</strong></span>
    </div>

    <button type="button" class="complete-btn" (click)="onCompleteTask()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      Complete
    </button>
  </div>
</app-card>
