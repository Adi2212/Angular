<form (ngSubmit)="onSubmit()">
  <div class="form-header">
    <h2>Investment Parameters</h2>
    <p>Configure your principal, recurring deposits, and expected rates</p>
  </div>

  <div class="input-grid">
    <div class="input-control">
      <label for="initial-investment">Initial Investment ($)</label>
      <div class="input-wrapper">
        <span class="affix prefix">$</span>
        <input
          type="number"
          name="initial-investment"
          id="initial-investment"
          [(ngModel)]="initialInvestment"
          min="0"
          placeholder="0"
          required
        />
      </div>
    </div>

    <div class="input-control">
      <label for="annual-investment">Annual Investment ($)</label>
      <div class="input-wrapper">
        <span class="affix prefix">$</span>
        <input
          type="number"
          name="annual-investment"
          id="annual-investment"
          [(ngModel)]="annualInvestment"
          min="0"
          placeholder="0"
          required
        />
      </div>
    </div>

    <div class="input-control">
      <label for="years">Duration (Years)</label>
      <div class="input-wrapper">
        <input
          type="number"
          name="years"
          id="years"
          [(ngModel)]="years"
          min="1"
          max="100"
          placeholder="10"
          required
        />
        <span class="affix suffix">Yrs</span>
      </div>
    </div>

    <div class="input-control">
      <label for="expected-return">Expected Return (%)</label>
      <div class="input-wrapper">
        <input
          type="number"
          name="expected-return"
          id="expected-return"
          [(ngModel)]="expectedReturn"
          min="0"
          max="100"
          step="0.1"
          placeholder="5"
          required
        />
        <span class="affix suffix">%</span>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="submit">
      <span>Calculate Projections</span>
      <svg class="button-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
        <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
      </svg>
    </button>
  </div>
</form>
