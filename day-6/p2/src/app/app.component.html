@if (isNetworkLoading()) {
  <div class="global-progress-bar"></div>
}

<header>
  <img src="logo.png" alt="Stylized globe" />
  <h1>PlacePicker</h1>
  <p>
    Create your personal collection of places you would like to visit or you
    have visited.
  </p>
</header>

<main>
  @if (error()) {
    <aside class="error-modal-backdrop" (click)="onErrorClose()">
      <div class="error-modal" (click)="$event.stopPropagation()">
        <h2>An error occurred!</h2>
        <p>{{ error() }}</p>
        <button (click)="onErrorClose()">Okay</button>
      </div>
    </aside>
  }

  <app-user-places />

  <app-available-places />
</main>
