<div class="flex items-center justify-center min-h-screen bg-background p-4">
  <div class="w-full max-w-md bg-card rounded-3xl p-8 border border-border shadow-xl space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-primary/10 text-primary flex items-center justify-center text-3xl shadow-sm">
        🛡️
      </div>
      <h1 class="text-2xl font-bold text-foreground">Admin Portal Login</h1>
      <p class="text-xs text-muted-foreground">Secure governance access for platform administrators only</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="handleAdminLogin()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-foreground mb-1">Administrator Email</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="admin@agrisell.com"
          class="w-full px-3.5 py-2.5 text-xs bg-muted/40 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-foreground mb-1">Password</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password" 
            name="password" 
            required 
            placeholder="••••••••"
            class="w-full pl-3.5 pr-10 py-2.5 text-xs bg-muted/40 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
          />
          <button 
            type="button" 
            (click)="showPassword.set(!showPassword())"
            class="absolute right-3 inset-y-0 flex items-center text-muted-foreground hover:text-foreground text-xs font-semibold">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="pt-2">
        <button 
          type="submit" 
          [disabled]="loading() || !email || !password"
          class="w-full btn-primary py-3 text-xs font-bold disabled:opacity-50">
          @if (loading()) {
            <span>Verifying Credentials...</span>
          } @else {
            <span>Access Admin Center &rarr;</span>
          }
        </button>
      </div>
    </form>

    <div class="text-center pt-2 border-t border-border/60">
      <a routerLink="/login" class="text-xs text-primary font-semibold hover:underline">
        &larr; Return to Consumer / Farmer Login
      </a>
    </div>

  </div>
</div>
