<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-500/10 text-amber-600 flex items-center justify-center font-bold text-xl">
        🔑
      </div>
      <h2 class="text-2xl font-extrabold font-display text-slate-900 tracking-tight">Forgot Password?</h2>
      <p class="text-xs text-slate-500">Enter your registered email and we'll send you a password reset link.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required
          placeholder="user@example.com"
          class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="!email"
        class="w-full btn-primary py-2.5 text-xs font-bold disabled:bg-slate-300">
        Send Reset Link
      </button>
    </form>

    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100 flex justify-between">
      <a routerLink="/auth/login" class="text-emerald-600 font-semibold hover:underline">&larr; Back to Login</a>
      <a routerLink="/auth/reset-password" class="text-slate-400 hover:text-slate-600">Have a reset token?</a>
    </div>

  </div>
</div>
