<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-emerald-500/10 text-emerald-600 flex items-center justify-center font-bold text-xl">
        🔒
      </div>
      <h2 class="text-2xl font-extrabold font-display text-slate-900 tracking-tight">Set New Password</h2>
      <p class="text-xs text-slate-500">Enter your reset token and new secure password</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Reset Token</label>
        <input 
          type="text" 
          [(ngModel)]="token" 
          name="token" 
          required
          placeholder="e.g. 4a719263-d142-4fce-b247..."
          class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">New Password (min 6 characters)</label>
        <input 
          type="password" 
          [(ngModel)]="newPassword" 
          name="newPassword" 
          required 
          minlength="6"
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-1 focus:ring-emerald-500"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="!token || !newPassword"
        class="w-full btn-primary py-2.5 text-xs font-bold disabled:bg-slate-300">
        Reset Password
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
      Remembered your credentials? 
      <a routerLink="/auth/login" class="font-bold text-emerald-600 hover:underline">Sign In</a>
    </p>

  </div>
</div>
