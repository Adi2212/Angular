<div class="flex min-h-screen items-center justify-center bg-background p-4">
  <div class="w-full max-w-md bg-card rounded-3xl p-6 sm:p-8 border border-border shadow-xl space-y-5">
    
    <div class="text-center space-y-1">
      <span class="text-3xl">📍</span>
      <h1 class="text-2xl font-bold text-primary">Add Delivery Address</h1>
      <p class="text-xs text-muted-foreground">Please configure your shipping coordinates for direct farm dispatch</p>
    </div>

    @if (error()) {
      <div class="p-3 rounded-xl bg-rose-50 text-rose-700 text-xs border border-rose-200">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="handleSubmit()" class="space-y-3.5 text-xs">
      <div>
        <label class="block font-semibold text-foreground mb-1">Street Address</label>
        <input 
          type="text" 
          [(ngModel)]="form.street" 
          name="street" 
          required 
          placeholder="Plot 10, Green Valley Rd"
          class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
        />
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-foreground mb-1">City</label>
          <input 
            type="text" 
            [(ngModel)]="form.city" 
            name="city" 
            required 
            placeholder="Nashik"
            class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
          />
        </div>
        <div>
          <label class="block font-semibold text-foreground mb-1">District</label>
          <input 
            type="text" 
            [(ngModel)]="form.district" 
            name="district" 
            required 
            placeholder="Nashik District"
            class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
          />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block font-semibold text-foreground mb-1">State</label>
          <input 
            type="text" 
            [(ngModel)]="form.state" 
            name="state" 
            required 
            placeholder="Maharashtra"
            class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
          />
        </div>
        <div>
          <label class="block font-semibold text-foreground mb-1">Postal Code</label>
          <input 
            type="text" 
            [(ngModel)]="form.postalCode" 
            name="postalCode" 
            required 
            placeholder="422001"
            class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
          />
        </div>
      </div>

      <div>
        <label class="block font-semibold text-foreground mb-1">Country</label>
        <input 
          type="text" 
          [(ngModel)]="form.country" 
          name="country" 
          required 
          placeholder="India"
          class="w-full px-3.5 py-2.5 bg-muted/30 border border-border rounded-xl focus:bg-background focus:outline-none focus:ring-1 focus:ring-primary text-foreground"
        />
      </div>

      <div class="pt-3">
        <button 
          type="submit" 
          [disabled]="loading() || !form.street || !form.city || !form.postalCode"
          class="w-full btn-primary py-3 text-xs font-bold disabled:opacity-50">
          @if (loading()) {
            <span>Saving Address...</span>
          } @else {
            <span>Save Address & Continue &rarr;</span>
          }
        </button>
      </div>
    </form>

  </div>
</div>
