<div class="min-h-[75vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-slate-200/80 shadow-xl text-center space-y-6">
    
    <div class="w-16 h-16 mx-auto rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl">
      ⚠️
    </div>

    <div class="space-y-2">
      <h1 class="text-2xl font-extrabold font-display text-slate-900 tracking-tight">Payment Not Completed</h1>
      <p class="text-xs text-slate-500">
        The payment transaction for Order #{{ orderId() }} was cancelled or timed out.
      </p>
    </div>

    <div class="space-y-3 pt-2">
      <button 
        (click)="onRetryPayment()" 
        class="w-full btn-primary py-2.5 text-xs font-bold">
        🔄 Retry Payment Now
      </button>
      
      <a routerLink="/cart" class="w-full btn-secondary py-2.5 text-xs font-bold">
        Return to Basket
      </a>
    </div>

  </div>
</div>
