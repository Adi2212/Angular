<span 
  class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold capitalize tracking-wide"
  [ngClass]="{
    'bg-amber-100 text-amber-800 border border-amber-200': status === 'PENDING',
    'bg-blue-100 text-blue-800 border border-blue-200': status === 'CONFIRMED',
    'bg-purple-100 text-purple-800 border border-purple-200': status === 'SHIPPED',
    'bg-emerald-100 text-emerald-800 border border-emerald-200': status === 'DELIVERED',
    'bg-rose-100 text-rose-800 border border-rose-200': status === 'CANCELLED'
  }">
  <span class="w-1.5 h-1.5 rounded-full"
    [ngClass]="{
      'bg-amber-500 animate-pulse': status === 'PENDING',
      'bg-blue-500': status === 'CONFIRMED',
      'bg-purple-500': status === 'SHIPPED',
      'bg-emerald-500': status === 'DELIVERED',
      'bg-rose-500': status === 'CANCELLED'
    }"></span>
  {{ status }}
</span>
