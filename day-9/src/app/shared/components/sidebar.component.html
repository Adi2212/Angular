<!-- Mobile Backdrop -->
@if (isOpen()) {
  <div 
    class="fixed inset-0 bg-black/40 z-40 lg:hidden"
    (click)="closeSidebar()">
  </div>
}

<!-- Sidebar Aside -->
<aside
  class="fixed top-0 left-0 h-full w-64 bg-background border-r border-border
         transform transition-transform duration-300 z-50
         flex flex-col justify-between"
  [class.translate-x-0]="isOpen()"
  [class.-translate-x-full]="!isOpen()"
  [class.lg:translate-x-0]="true">
  
  <div>
    <!-- Brand Header -->
    <div class="h-16 px-4 border-b border-border flex items-center justify-between">
      <a routerLink="/home" (click)="closeSidebar()" class="flex items-center gap-2.5">
        <img src="assets/logo.png" alt="AgriSell Logo" class="h-8 w-8 rounded-full object-cover" />
        <h2 class="text-base font-bold text-foreground truncate">{{ title() }}</h2>
      </a>
      <button 
        type="button"
        class="lg:hidden p-1.5 text-muted-foreground hover:text-foreground rounded-lg"
        (click)="closeSidebar()">
        ✕
      </button>
    </div>

    <!-- Menu Links -->
    <nav class="p-4 space-y-1.5 text-sm">
      @for (item of menuItems(); track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="bg-secondary text-foreground font-semibold shadow-xs"
          [routerLinkActiveOptions]="{ exact: item.route === '/home' || item.route === '/' }"
          (click)="closeSidebar()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all cursor-pointer text-muted-foreground hover:bg-secondary/40 hover:text-foreground">
          <span class="text-base">{{ item.emoji }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- User / Session Footer in Sidebar -->
  <div class="p-4 border-t border-border bg-muted/20">
    @if (auth.isAuthenticated()) {
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-2 truncate">
          <div class="w-7 h-7 rounded-full bg-primary/20 text-primary font-bold flex items-center justify-center shrink-0">
            {{ auth.currentUser()?.name?.charAt(0) || 'U' }}
          </div>
          <div class="truncate">
            <span class="font-bold text-foreground block truncate">{{ auth.currentUser()?.name }}</span>
            <span class="text-[10px] text-muted-foreground uppercase font-semibold">{{ auth.role() }}</span>
          </div>
        </div>
        <button 
          (click)="auth.logout()"
          title="Sign out"
          class="p-1 text-rose-600 hover:bg-rose-50 rounded">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      </div>
    } @else {
      <a 
        routerLink="/auth/login" 
        (click)="closeSidebar()"
        class="w-full btn-primary text-xs py-2">
        Sign In
      </a>
    }
  </div>

</aside>
